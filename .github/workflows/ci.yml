name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning cohort.sh install-cohort.sh test-cohort.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          # macOS ships bash 3.2, which is the oldest bash cohort claims to
          # support. Running the suite under /bin/bash there is the whole
          # point of this leg, so do not "fix" it to the brew bash on PATH.
          - os: macos-latest
            shell: /bin/bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
      - name: Versions under test
        run: |
          ${{ matrix.shell }} --version | head -1
          tmux -V
      - name: Run the suite
        run: ${{ matrix.shell }} ./test-cohort.sh -v

  # fish is not installed on the runners, and its completion syntax is nothing
  # like bash's, so check the generated script actually loads and completes.
  fish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y fish tmux
      # The completion shells out to `cohort`, so it has to be on PATH for the
      # session-name check to mean anything.
      - name: Put cohort on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          cp cohort.sh "$HOME/.local/bin/cohort"
          chmod +x "$HOME/.local/bin/cohort"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: The generated script loads
        run: |
          cohort completion fish >/tmp/cohort.fish
          fish -c 'source /tmp/cohort.fish'
      - name: And it completes subcommands
        run: |
          out=$(fish -c 'source /tmp/cohort.fish; complete -C "cohort "')
          echo "$out"
          echo "$out" | grep -q attach
      - name: And it completes live session names
        run: |
          printf '#!/bin/sh\nsleep 120\n' >/tmp/stub && chmod +x /tmp/stub
          cohort new --command /tmp/stub fishy --no-worktree
          cohort ls --names
          out=$(fish -c 'source /tmp/cohort.fish; complete -C "cohort attach "')
          echo "$out"
          echo "$out" | grep -q fishy
          cohort kill --all --yes

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No tmux preinstalled here on purpose: this leg checks that the
      # installer puts it there itself, which is the path a new user takes.
      - name: Install from the checkout
        run: ./install-cohort.sh --bindir "$HOME/.local/bin" --yes
      - name: tmux is present afterwards
        run: command -v tmux && tmux -V
      - name: The installed command runs
        run: $HOME/.local/bin/cohort config
      # grep exits 2 for a missing file even when it matched another, and which
      # rc files exist differs per runner, so ask each one separately.
      - name: Completion was wired into a shell
        run: |
          found=""
          for rc in "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.zshrc"; do
            if [ -f "$rc" ] && grep -q "BEGIN cohort" "$rc"; then found="$rc"; fi
          done
          if [ -z "$found" ]; then echo "no shell was wired" >&2; exit 1; fi
          echo "wired: $found"
      - name: Uninstall is clean
        run: |
          ./install-cohort.sh --uninstall --bindir "$HOME/.local/bin"
          test ! -e "$HOME/.local/bin/cohort"
          for rc in "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.zshrc"; do
            if [ -f "$rc" ] && grep -q "BEGIN cohort" "$rc"; then
              echo "block left behind in $rc" >&2; exit 1
            fi
          done
